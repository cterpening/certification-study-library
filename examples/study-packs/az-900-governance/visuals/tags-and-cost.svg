<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="594" viewBox="0 0 1000 594" role="img" aria-labelledby="title description">
<title id="title">Follow the record: resource, usage, or authorization</title>
<desc id="description">Resource-group tag — If supported cost inheritance is enabled → Cost Management usage record; Resource metadata tags — Where resource tags appear in usage → Cost Management usage record; Cost Management usage record — Financial reporting → Cost report and allocation analysis; Scoped role assignment — Grants scoped permissions → Resource authorization</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<rect width="1000" height="594" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="36" font-size="23" font-weight="bold">Follow the record: resource, usage, or authorization</text>
<rect x="28" y="86" width="320" height="120" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="116" font-size="17">Resource-group tag</text>
<rect x="652" y="86" width="320" height="120" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="116" font-size="17">Cost Management usage record</text>
<path d="M360,187 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="113" text-anchor="middle" font-size="16">If supported cost</text>
<text x="500" y="135" text-anchor="middle" font-size="16">inheritance is</text>
<text x="500" y="157" text-anchor="middle" font-size="16">enabled</text>
<rect x="28" y="224" width="320" height="120" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="254" font-size="17">Resource metadata tags</text>
<rect x="652" y="224" width="320" height="120" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="254" font-size="17">Cost Management usage record</text>
<path d="M360,325 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="251" text-anchor="middle" font-size="16">Where resource</text>
<text x="500" y="273" text-anchor="middle" font-size="16">tags appear in</text>
<text x="500" y="295" text-anchor="middle" font-size="16">usage</text>
<rect x="28" y="362" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="392" font-size="17">Cost Management usage record</text>
<rect x="652" y="362" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="392" font-size="17">Cost report and allocation</text>
<text x="668" y="414" font-size="17">analysis</text>
<path d="M360,441 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="389" text-anchor="middle" font-size="16">Financial</text>
<text x="500" y="411" text-anchor="middle" font-size="16">reporting</text>
<rect x="28" y="478" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="508" font-size="17">Scoped role assignment</text>
<rect x="652" y="478" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="508" font-size="17">Resource authorization</text>
<path d="M360,557 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="505" text-anchor="middle" font-size="16">Grants scoped</text>
<text x="500" y="527" text-anchor="middle" font-size="16">permissions</text>
</g>
