<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="572" viewBox="0 0 1000 572" role="img" aria-labelledby="title description">
<title id="title">One deployment, two governance questions</title>
<desc id="description">Who may perform this action at this scope? — Examine role assignments → Azure RBAC: scoped permission grants; Does the request satisfy applicable rules? — Examine policy assignments → Azure Policy: configured rules and effects; Azure RBAC: scoped permission grants — Troubleshoot permission failures → Inspect the actual denial, configuration, and scope; Azure Policy: configured rules and effects — Troubleshoot rule failures → Inspect the actual denial, configuration, and scope</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<rect width="1000" height="572" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="36" font-size="23" font-weight="bold">One deployment, two governance questions</text>
<rect x="28" y="86" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="116" font-size="17">Who may perform this action at</text>
<text x="44" y="138" font-size="17">this scope?</text>
<rect x="652" y="86" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="116" font-size="17">Azure RBAC: scoped permission</text>
<text x="668" y="138" font-size="17">grants</text>
<path d="M360,165 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="113" text-anchor="middle" font-size="16">Examine role</text>
<text x="500" y="135" text-anchor="middle" font-size="16">assignments</text>
<rect x="28" y="202" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="232" font-size="17">Does the request satisfy</text>
<text x="44" y="254" font-size="17">applicable rules?</text>
<rect x="652" y="202" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="232" font-size="17">Azure Policy: configured rules</text>
<text x="668" y="254" font-size="17">and effects</text>
<path d="M360,281 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="229" text-anchor="middle" font-size="16">Examine policy</text>
<text x="500" y="251" text-anchor="middle" font-size="16">assignments</text>
<rect x="28" y="318" width="320" height="120" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="348" font-size="17">Azure RBAC: scoped permission</text>
<text x="44" y="370" font-size="17">grants</text>
<rect x="652" y="318" width="320" height="120" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="348" font-size="17">Inspect the actual denial,</text>
<text x="668" y="370" font-size="17">configuration, and scope</text>
<path d="M360,419 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="345" text-anchor="middle" font-size="16">Troubleshoot</text>
<text x="500" y="367" text-anchor="middle" font-size="16">permission</text>
<text x="500" y="389" text-anchor="middle" font-size="16">failures</text>
<rect x="28" y="456" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="486" font-size="17">Azure Policy: configured rules</text>
<text x="44" y="508" font-size="17">and effects</text>
<rect x="652" y="456" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="486" font-size="17">Inspect the actual denial,</text>
<text x="668" y="508" font-size="17">configuration, and scope</text>
<path d="M360,535 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="483" text-anchor="middle" font-size="16">Troubleshoot rule</text>
<text x="500" y="505" text-anchor="middle" font-size="16">failures</text>
</g>
</svg>
