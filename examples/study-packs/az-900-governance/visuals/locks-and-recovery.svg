<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="434" viewBox="0 0 1000 434" role="img" aria-labelledby="title description">
<title id="title">Identify the operation before choosing protection</title>
<desc id="description">Delete account through management API — Inspect management protection → Applicable management lock; Delete blob through data API — Inspect data permissions → Applicable data authorization; Deletion has occurred: can data be restored? — A separate recovery question → Inspect recovery configuration and test evidence</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<rect width="1000" height="434" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="36" font-size="23" font-weight="bold">Identify the operation before choosing protection</text>
<rect x="28" y="86" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="116" font-size="17">Delete account through</text>
<text x="44" y="138" font-size="17">management API</text>
<rect x="652" y="86" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="116" font-size="17">Applicable management lock</text>
<path d="M360,165 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="113" text-anchor="middle" font-size="16">Inspect management</text>
<text x="500" y="135" text-anchor="middle" font-size="16">protection</text>
<rect x="28" y="202" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="232" font-size="17">Delete blob through data API</text>
<rect x="652" y="202" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="232" font-size="17">Applicable data authorization</text>
<path d="M360,281 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="229" text-anchor="middle" font-size="16">Inspect data</text>
<text x="500" y="251" text-anchor="middle" font-size="16">permissions</text>
<rect x="28" y="318" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="348" font-size="17">Deletion has occurred: can</text>
<text x="44" y="370" font-size="17">data be restored?</text>
<rect x="652" y="318" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="348" font-size="17">Inspect recovery configuration</text>
<text x="668" y="370" font-size="17">and test evidence</text>
<path d="M360,397 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="345" text-anchor="middle" font-size="16">A separate</text>
<text x="500" y="367" text-anchor="middle" font-size="16">recovery question</text>
</g>
</svg>
