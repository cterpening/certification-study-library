<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="434" viewBox="0 0 1000 434" role="img" aria-labelledby="title description">
<title id="title">Match the report to one row per order</title>
<desc id="description">Two tickets on one order, one on the other — Group and count by order ID → One ticket count per order ID; Two paid orders at $20 each — Preserve each paid order → Two order rows, $40 paid, three tickets; One ticket count per order ID — Attach count to its order → Two order rows, $40 paid, three tickets</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<rect width="1000" height="434" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="36" font-size="23" font-weight="bold">Match the report to one row per order</text>
<rect x="28" y="86" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="116" font-size="17">Two tickets on one order, one</text>
<text x="44" y="138" font-size="17">on the other</text>
<rect x="652" y="86" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="116" font-size="17">One ticket count per order ID</text>
<path d="M360,165 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="113" text-anchor="middle" font-size="16">Group and count by</text>
<text x="500" y="135" text-anchor="middle" font-size="16">order ID</text>
<rect x="28" y="202" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="232" font-size="17">Two paid orders at $20 each</text>
<rect x="652" y="202" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="232" font-size="17">Two order rows, $40 paid,</text>
<text x="668" y="254" font-size="17">three tickets</text>
<path d="M360,281 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="229" text-anchor="middle" font-size="16">Preserve each paid</text>
<text x="500" y="251" text-anchor="middle" font-size="16">order</text>
<rect x="28" y="318" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="348" font-size="17">One ticket count per order ID</text>
<rect x="652" y="318" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="348" font-size="17">Two order rows, $40 paid,</text>
<text x="668" y="370" font-size="17">three tickets</text>
<path d="M360,397 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="345" text-anchor="middle" font-size="16">Attach count to</text>
<text x="500" y="367" text-anchor="middle" font-size="16">its order</text>
</g>
</svg>
