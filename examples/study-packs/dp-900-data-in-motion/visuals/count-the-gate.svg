<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="434" viewBox="0 0 1000 434" role="img" aria-labelledby="title description">
<title id="title">Reconcile the gate counter</title>
<desc id="description">Two distinct scans received by noon — Count each scan once → Provisional count of two; Repeat of the second scan — Same event ID adds zero → Provisional count of two; Third scan arrives after noon — Scan time fits the earlier window → Revised count of three</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<rect width="1000" height="434" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="36" font-size="23" font-weight="bold">Reconcile the gate counter</text>
<rect x="28" y="86" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="116" font-size="17">Two distinct scans received by</text>
<text x="44" y="138" font-size="17">noon</text>
<rect x="652" y="86" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="116" font-size="17">Provisional count of two</text>
<path d="M360,165 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="113" text-anchor="middle" font-size="16">Count each scan</text>
<text x="500" y="135" text-anchor="middle" font-size="16">once</text>
<rect x="28" y="202" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="232" font-size="17">Repeat of the second scan</text>
<rect x="652" y="202" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="232" font-size="17">Provisional count of two</text>
<path d="M360,281 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="229" text-anchor="middle" font-size="16">Same event ID adds</text>
<text x="500" y="251" text-anchor="middle" font-size="16">zero</text>
<rect x="28" y="318" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="348" font-size="17">Third scan arrives after noon</text>
<rect x="652" y="318" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="348" font-size="17">Revised count of three</text>
<path d="M360,397 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="345" text-anchor="middle" font-size="16">Scan time fits the</text>
<text x="500" y="367" text-anchor="middle" font-size="16">earlier window</text>
</g>
</svg>
