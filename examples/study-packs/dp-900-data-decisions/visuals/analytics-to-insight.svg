<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="594" viewBox="0 0 1000 594" role="img" aria-labelledby="title description">
<title id="title">Illustrative Import workflow: follow the freshness evidence</title>
<desc id="description">Sale committed at 10:00 — Receive source data → Ingested at 10:03; Ingested at 10:03 — Validate and reshape → Transformed at 10:05; Transformed at 10:05 — Wait for the defined refresh path → Import-model refresh completed at 10:15; Import-model refresh completed at 10:15 — Presentation depends on its model → Report can use the updated model</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<rect width="1000" height="594" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="36" font-size="23" font-weight="bold">Illustrative Import workflow: follow the freshness evidence</text>
<rect x="28" y="86" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="116" font-size="17">Sale committed at 10:00</text>
<rect x="652" y="86" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="116" font-size="17">Ingested at 10:03</text>
<path d="M360,165 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="113" text-anchor="middle" font-size="16">Receive source</text>
<text x="500" y="135" text-anchor="middle" font-size="16">data</text>
<rect x="28" y="202" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="232" font-size="17">Ingested at 10:03</text>
<rect x="652" y="202" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="232" font-size="17">Transformed at 10:05</text>
<path d="M360,281 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="229" text-anchor="middle" font-size="16">Validate and</text>
<text x="500" y="251" text-anchor="middle" font-size="16">reshape</text>
<rect x="28" y="318" width="320" height="120" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="348" font-size="17">Transformed at 10:05</text>
<rect x="652" y="318" width="320" height="120" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="348" font-size="17">Import-model refresh completed</text>
<text x="668" y="370" font-size="17">at 10:15</text>
<path d="M360,419 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="345" text-anchor="middle" font-size="16">Wait for the</text>
<text x="500" y="367" text-anchor="middle" font-size="16">defined refresh</text>
<text x="500" y="389" text-anchor="middle" font-size="16">path</text>
<rect x="28" y="456" width="320" height="120" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="486" font-size="17">Import-model refresh completed</text>
<text x="44" y="508" font-size="17">at 10:15</text>
<rect x="652" y="456" width="320" height="120" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="486" font-size="17">Report can use the updated</text>
<text x="668" y="508" font-size="17">model</text>
<path d="M360,557 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="483" text-anchor="middle" font-size="16">Presentation</text>
<text x="500" y="505" text-anchor="middle" font-size="16">depends on its</text>
<text x="500" y="527" text-anchor="middle" font-size="16">model</text>
</g>
</svg>
