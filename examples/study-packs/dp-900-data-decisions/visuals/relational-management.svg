<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="456" viewBox="0 0 1000 456" role="img" aria-labelledby="title description">
<title id="title">Let compatibility and control guide the SQL choice</title>
<desc id="description">Managed database for a compatible cloud application — Database-oriented management → Evaluate Azure SQL Database; Broader instance-level SQL Server dependencies — Check exact feature compatibility → Evaluate Azure SQL Managed Instance; Guest OS and SQL installation control required — More control and customer work → Evaluate SQL Server on Azure Virtual Machines</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<rect width="1000" height="456" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="36" font-size="23" font-weight="bold">Let compatibility and control guide the SQL choice</text>
<rect x="28" y="86" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="116" font-size="17">Managed database for a</text>
<text x="44" y="138" font-size="17">compatible cloud application</text>
<rect x="652" y="86" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="116" font-size="17">Evaluate Azure SQL Database</text>
<path d="M360,165 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="113" text-anchor="middle" font-size="16">Database-oriented</text>
<text x="500" y="135" text-anchor="middle" font-size="16">management</text>
<rect x="28" y="202" width="320" height="120" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="232" font-size="17">Broader instance-level SQL</text>
<text x="44" y="254" font-size="17">Server dependencies</text>
<rect x="652" y="202" width="320" height="120" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="232" font-size="17">Evaluate Azure SQL Managed</text>
<text x="668" y="254" font-size="17">Instance</text>
<path d="M360,303 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="229" text-anchor="middle" font-size="16">Check exact</text>
<text x="500" y="251" text-anchor="middle" font-size="16">feature</text>
<text x="500" y="273" text-anchor="middle" font-size="16">compatibility</text>
<rect x="28" y="340" width="320" height="98" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="370" font-size="17">Guest OS and SQL installation</text>
<text x="44" y="392" font-size="17">control required</text>
<rect x="652" y="340" width="320" height="98" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="370" font-size="17">Evaluate SQL Server on Azure</text>
<text x="668" y="392" font-size="17">Virtual Machines</text>
<path d="M360,419 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="367" text-anchor="middle" font-size="16">More control and</text>
<text x="500" y="389" text-anchor="middle" font-size="16">customer work</text>
</g>
</svg>
