<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img" aria-labelledby="title description">
<title id="title">Trace a reservation through the failure</title>
<desc id="description">Customer submits reservation — Route the request → Reachable app with capacity; Reachable app with capacity — Save the booking → Available booking database; Available booking database — Confirm success → Confirmed reservation</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<rect width="1000" height="368" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="36" font-size="23" font-weight="bold">Trace a reservation through the failure</text>
<rect x="28" y="86" width="320" height="76" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="116" font-size="17">Customer submits reservation</text>
<rect x="652" y="86" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="116" font-size="17">Reachable app with capacity</text>
<path d="M360,143 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="113" text-anchor="middle" font-size="16">Route the request</text>
<rect x="28" y="180" width="320" height="76" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="210" font-size="17">Reachable app with capacity</text>
<rect x="652" y="180" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="210" font-size="17">Available booking database</text>
<path d="M360,237 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="207" text-anchor="middle" font-size="16">Save the booking</text>
<rect x="28" y="274" width="320" height="76" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="304" font-size="17">Available booking database</text>
<rect x="652" y="274" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="304" font-size="17">Confirmed reservation</text>
<path d="M360,331 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="301" text-anchor="middle" font-size="16">Confirm success</text>
</g>
</svg>
