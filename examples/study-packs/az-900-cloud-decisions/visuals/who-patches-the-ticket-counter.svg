<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img" aria-labelledby="title description">
<title id="title">Match the requirement to the layer the theater owns</title>
<desc id="description">Use a finished booking app — Configure its use → Software as a service; Deploy custom booking code — Bring the code → Managed web platform; Install a guest OS driver — Administer the OS → Customer-managed virtual machine</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<rect width="1000" height="368" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="36" font-size="23" font-weight="bold">Match the requirement to the layer the theater owns</text>
<rect x="28" y="86" width="320" height="76" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="116" font-size="17">Use a finished booking app</text>
<rect x="652" y="86" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="116" font-size="17">Software as a service</text>
<path d="M360,143 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="113" text-anchor="middle" font-size="16">Configure its use</text>
<rect x="28" y="180" width="320" height="76" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="210" font-size="17">Deploy custom booking code</text>
<rect x="652" y="180" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="210" font-size="17">Managed web platform</text>
<path d="M360,237 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="207" text-anchor="middle" font-size="16">Bring the code</text>
<rect x="28" y="274" width="320" height="76" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="304" font-size="17">Install a guest OS driver</text>
<rect x="652" y="274" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="304" font-size="17">Customer-managed virtual</text>
<text x="668" y="326" font-size="17">machine</text>
<path d="M360,331 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="301" text-anchor="middle" font-size="16">Administer the OS</text>
</g>
</svg>
