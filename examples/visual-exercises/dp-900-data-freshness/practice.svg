<text x="447" y="790" font-size="20" fill="#163047" font-weight="700">Calculate both intervals</text>
<text x="447" y="820" font-size="17" fill="#334e63" font-weight="400">How long from sale to updated</text>
<text x="447" y="845" font-size="17" fill="#334e63" font-weight="400">model? How long from completed</text>
<text x="447" y="870" font-size="17" fill="#334e63" font-weight="400">transformation to updated model?</text>
<path d="M447 925 H753 M447 949 H753" stroke="#93a8b6" fill="none"/>
<rect x="794" y="726" width="342" height="240" rx="14" fill="#ffffff" stroke="#b6c6cf"/>
<text x="812" y="755" font-size="13" fill="#0e6654" font-weight="700">03  CHOOSE THE FIRST CHECK</text>
<text x="812" y="790" font-size="20" fill="#163047" font-weight="700">Choose and justify a check</text>
<text x="812" y="820" font-size="17" fill="#334e63" font-weight="400">Would you inspect the chart</text>
<text x="812" y="845" font-size="17" fill="#334e63" font-weight="400">design or the model refresh and</text>
<text x="812" y="870" font-size="17" fill="#334e63" font-weight="400">access mode first? Explain your</text>
<text x="812" y="895" font-size="17" fill="#334e63" font-weight="400">choice.</text>
