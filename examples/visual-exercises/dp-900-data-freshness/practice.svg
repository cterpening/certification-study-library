<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title description">
<title id="title">DP-900 data freshness — practice exercise</title>
<desc id="description">DP-900. Practice version. At 10:10, the report does not include the 10:00 sale. Why? The invented scenario assumes a successful 10:15 Import-model refresh includes the sale. 10:00: Sale committed. The source records the new sale. 10:03: Ingestion done. The pipeline has received the sale. 10:05: Transform done. The prepared data includes the sale. 10:10: Report checked. The sale is missing from the report. 10:15: Refresh done. The Import model now includes the sale. Events are shown in order; spacing is not elapsed time. 01  FIND THE BOUNDARY. Explain the missing sale. At 10:10, which steps are complete? Which relevant step has not completed? Explain using two timestamps. 02  EXPLAIN THE INTERVAL. Calculate both intervals. How long from sale to updated model? How long from completed transformation to updated model? 03  CHOOSE THE FIRST CHECK. Choose and justify a check. Would you inspect the chart design or the model refresh and access mode first? Explain your choice. An updated model does not guarantee that an already-open report display updates at that instant. Illustrative Import workflow only. Invented times; no service guarantee. VERIFY CURRENT: access mode and refresh settings. AI-generated draft; human review pending. Official blueprint is authoritative.</desc>
