<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="title description">
<title id="title">AZ-900 governance scope — study exercise</title>
<desc id="description">AZ-900 study version. Why is this VM request blocked? Original invented scenario. The identity app-deploy has permission to create the requested virtual machine at resource group rg-research. The map places that resource group inside subscription learning-sub. A role assignment associates principal app-deploy, a role permitting VM creation, and scope rg-research. A separate Azure Policy assignment at subscription scope applies to this request: its allowed location is East US and its effect is deny. No exclusion or exemption applies in this scenario. An arrow from app-deploy points to a proposed Azure Virtual Machine create request inside the target resource group: vm-study, location West US. The dashed request box represents requested configuration, not a deployed resource. Lines connect assignments to their applicable scope; they do not represent an order of Azure checks. Explanation: permission is granted, but West US does not meet the East US requirement. The applicable deny blocks this request. Inspect the error and applicable Policy assignment, then use an approved location or seek an approved exception. Broader RBAC permission does not resolve this stated Policy denial. Simplified scope map; other checks can affect real requests. VERIFY CURRENT: actual assignments, effects, exclusions and exemptions. Selected objectives only. Independent AI-assisted draft; human review pending. Accepted baseline July 20, 2026. The official AZ-900 blueprint is authoritative. Original Microsoft icons embedded unchanged; Microsoft terms apply. Exact sources and the text exercise are in README.</desc>
