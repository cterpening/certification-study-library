<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img" aria-labelledby="title description">
<title id="title">When may the agent submit a refund?</title>
<desc id="description">Refund proposal awaits human review — Approved → Submit the approved refund request; Refund proposal awaits human review — Changes requested → Revise the proposal and request approval again; Refund proposal awaits human review — Declined → Close the request without issuing a refund</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<rect width="1000" height="368" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="36" font-size="23" font-weight="bold">When may the agent submit a refund?</text>
<path d="M348,237 H360 M360,143 V331" stroke="#334155" stroke-width="2" fill="none"/>
<rect x="28" y="199" width="320" height="76" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="229" font-size="17">Refund proposal awaits human</text>
<text x="44" y="251" font-size="17">review</text>
<rect x="652" y="86" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="116" font-size="17">Submit the approved refund</text>
<text x="668" y="138" font-size="17">request</text>
<path d="M360,143 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="113" text-anchor="middle" font-size="16">Approved</text>
<rect x="652" y="180" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="210" font-size="17">Revise the proposal and</text>
<text x="668" y="232" font-size="17">request approval again</text>
<path d="M360,237 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="207" text-anchor="middle" font-size="16">Changes requested</text>
<rect x="652" y="274" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="304" font-size="17">Close the request without</text>
<text x="668" y="326" font-size="17">issuing a refund</text>
<path d="M360,331 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="301" text-anchor="middle" font-size="16">Declined</text>
</g>
</svg>
