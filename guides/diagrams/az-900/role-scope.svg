<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img" aria-labelledby="title description">
<title id="title">How to read an Azure role assignment</title>
<desc id="description">One role assignment — Who gets access? → Security principal; One role assignment — Which permissions? → Role definition; One role assignment — Which resources? → Scope</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<rect width="1000" height="368" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="36" font-size="23" font-weight="bold">How to read an Azure role assignment</text>
<path d="M348,237 H360 M360,143 V331" stroke="#334155" stroke-width="2" fill="none"/>
<rect x="28" y="199" width="320" height="76" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="229" font-size="17">One role assignment</text>
<rect x="652" y="86" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="116" font-size="17">Security principal</text>
<path d="M360,143 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="113" text-anchor="middle" font-size="16">Who gets access?</text>
<rect x="652" y="180" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="210" font-size="17">Role definition</text>
<path d="M360,237 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="207" text-anchor="middle" font-size="16">Which permissions?</text>
<rect x="652" y="274" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="304" font-size="17">Scope</text>
<path d="M360,331 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="301" text-anchor="middle" font-size="16">Which resources?</text>
</g>
</svg>
