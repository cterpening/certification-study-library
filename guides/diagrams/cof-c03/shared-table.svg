<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" role="img" aria-labelledby="title description">
<title id="title">Do two warehouses need two copies of ORDERS?</title>
<desc id="description">One ORDERS table in shared storage — queried using → Reporting warehouse (daily totals); One ORDERS table in shared storage — queried using → Analytics warehouse (trend analysis)</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs>
<rect width="1000" height="274" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="36" font-size="23" font-weight="bold">Do two warehouses need two copies of ORDERS?</text>
<path d="M348,190 H360 M360,143 V237" stroke="#334155" stroke-width="2" fill="none"/>
<rect x="28" y="152" width="320" height="76" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="182" font-size="17">One ORDERS table in shared</text>
<text x="44" y="204" font-size="17">storage</text>
<rect x="652" y="86" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="116" font-size="17">Reporting warehouse (daily</text>
<text x="668" y="138" font-size="17">totals)</text>
<path d="M360,143 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="113" text-anchor="middle" font-size="16">queried using</text>
<rect x="652" y="180" width="320" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="668" y="210" font-size="17">Analytics warehouse (trend</text>
<text x="668" y="232" font-size="17">analysis)</text>
<path d="M360,237 H637" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="207" text-anchor="middle" font-size="16">queried using</text>
</g>
</svg>
