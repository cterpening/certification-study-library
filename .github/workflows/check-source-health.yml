name: Check source catalog health

on:
  schedule:
    - cron: "43 12 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check registered sources
        id: health
        run: |
          python3 scripts/check_source_health.py \
            --report source-health-report.json \
            --markdown-report source-health-report.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Add report to workflow summary
        if: always()
        run: cat source-health-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-health-report
          path: |
            source-health-report.json
            source-health-report.md
          retention-days: 30

      - name: Open or update source-review issue
        if: steps.health.outputs.needs_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Source catalog health review needed"
          gh label create maintenance \
            --color "6f42c1" \
            --description "Repository and study-guide maintenance" \
            --force
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file source-health-report.md
          else
            gh issue create --title "$title" --body-file source-health-report.md --label maintenance
          fi
