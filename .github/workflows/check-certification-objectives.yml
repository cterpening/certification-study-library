name: Check certification objectives

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

concurrency:
  group: certification-objective-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install test dependencies
        id: dependencies
        run: python3 -m pip install --requirement requirements-site.txt

      - name: Test objective monitor
        id: tests
        run: python3 -m unittest discover -s tests -v

      - name: Download and compare official objectives
        id: objectives
        run: |
          python3 scripts/check_official_study_guides.py \
            --write \
            --report objective-report.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload report to job summary
        if: always() && hashFiles('objective-report.json') != ''
        run: |
          {
            echo "## Certification objective monitor"
            echo
            echo '```json'
            cat objective-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create objective snapshot pull request
        id: snapshot_pr
        if: steps.objectives.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_EXAMS: ${{ steps.objectives.outputs.changed_exams }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="automation/objective-update-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/objective-snapshots
          git diff --cached -- data/objective-snapshots > objective-snapshot.patch
          git commit -m "Update official objective snapshots: ${CHANGED_EXAMS}"
          git push --set-upstream origin "$branch"
          python3 scripts/objective_workflow_report.py pull-request --output objective-pr-body.md
          count="$(jq '.changed | length' objective-report.json)"
          if ! gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --title "Official certification objective updates (${count} exams)" \
            --body-file objective-pr-body.md 2> objective-pr-error.txt; then
            cat objective-pr-error.txt >&2
            exit 1
          fi

      - name: Upload objective diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: objective-monitor-report
          path: |
            objective-report.json
            objective-snapshot.patch
            objective-pr-error.txt
          retention-days: 30

      - name: Open monitoring failure issue
        if: failure() || steps.objectives.outputs.errors == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_STEPS: ${{ toJson(steps) }}
        run: |
          title="Certification objective monitor needs attention"
          gh label create maintenance \
            --color "6f42c1" \
            --description "Repository and study-guide maintenance" \
            --force
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          python3 scripts/objective_workflow_report.py failure --output objective-failure.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file objective-failure.md
          else
            gh issue create --title "$title" --body-file objective-failure.md --label "maintenance"
          fi
