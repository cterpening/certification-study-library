name: Check certification objectives

on:
  schedule:
    - cron: "17 12 1 * *"
    - cron: "17 12 8 * *"
    - cron: "17 12 15 * *"
    - cron: "17 12 22 * *"
  workflow_dispatch:
    inputs:
      cohort:
        description: Monthly cohort to check (ignored when an exam code is supplied)
        type: choice
        options: ['1', '2', '3', '4']
        default: '1'
      exam_code:
        description: Optional single exam code for a targeted check
        type: string
        required: false

concurrency:
  group: certification-objective-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install test dependencies
        id: dependencies
        run: python3 -m pip install --requirement requirements-site.txt

      - name: Test objective monitor
        id: tests
        run: python3 -m unittest discover -s tests -v

      - name: Download and compare official objectives
        id: objectives
        env:
          REQUESTED_COHORT: ${{ github.event.inputs.cohort }}
          REQUESTED_EXAM: ${{ github.event.inputs.exam_code }}
          RUN_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$REQUESTED_EXAM" ]; then
            set -- --exam-code "$REQUESTED_EXAM"
          elif [ -n "$REQUESTED_COHORT" ]; then
            set -- --cohort "$REQUESTED_COHORT"
          else
            case "$RUN_SCHEDULE" in
              '17 12 1 * *') set -- --cohort 1 ;;
              '17 12 8 * *') set -- --cohort 2 ;;
              '17 12 15 * *') set -- --cohort 3 ;;
              '17 12 22 * *') set -- --cohort 4 ;;
              *) echo 'Unknown objective monitor schedule' >&2; exit 2 ;;
            esac
          fi
          python3 scripts/check_official_study_guides.py \
            "$@" \
            --write \
            --report objective-report.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload report to job summary
        if: always() && hashFiles('objective-report.json') != ''
        run: |
          {
            echo "## Certification objective monitor"
            echo
            echo '```json'
            cat objective-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save candidate snapshot diff
        if: always() && hashFiles('objective-report.json') != ''
        run: |
          git add -N data/objective-snapshots
          git diff -- data/objective-snapshots > objective-snapshot.patch

      - name: Open objective review task
        if: steps.objectives.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/objective_workflow_report.py --kind changes --output objective-changes.md
          gh label create maintenance \
            --color "6f42c1" \
            --description "Repository and study-guide maintenance" \
            --force
          gh issue create \
            --title "Objective changes from run ${GITHUB_RUN_ID}" \
            --body-file objective-changes.md \
            --label maintenance

      - name: Upload objective diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: objective-monitor-report
          path: |
            objective-report.json
            objective-snapshot.patch
          retention-days: 30

      - name: Open monitoring failure issue
        if: failure() || steps.objectives.outputs.errors == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_STEPS: ${{ toJson(steps) }}
        run: |
          title="Certification objective monitor needs attention"
          gh label create maintenance \
            --color "6f42c1" \
            --description "Repository and study-guide maintenance" \
            --force
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          python3 scripts/objective_workflow_report.py --output objective-failure.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file objective-failure.md
          else
            gh issue create --title "$title" --body-file objective-failure.md --label "maintenance"
          fi
