name: Review certification maintenance

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: certification-maintenance
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test maintenance reporting
        run: |
          python3 -m unittest discover -s tests -p test_certification_maintenance.py -v
          python3 -m unittest discover -s tests -p test_deep_review_queue.py -v
      - name: Collect all certification checks
        id: collect
        run: python3 scripts/run_certification_maintenance.py --output-dir .maintenance/current --mode monthly
      - name: Publish run summary
        if: always()
        run: |
          if [ -f .maintenance/current/maintenance-report.md ]; then
            cat .maintenance/current/maintenance-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Collection stopped before producing a report. Inspect the logs; this is not a clean check.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain evidence and candidate diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certification-maintenance
          path: .maintenance/current/
          include-hidden-files: true
          retention-days: 90
      - name: Refresh maintenance review task
        if: always() && steps.collect.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('.maintenance/current/maintenance-report.json')
          report = json.loads(path.read_text()) if path.exists() else None
          lines = ['The latest recurring certification review needs triage.', '',
                   f"[Run summary, per-exam evidence, logs and candidate diffs]({os.environ['RUN_URL']})", '']
          if report:
              lines += [f"Checked {report['summary']['guides']} guides; {report['summary']['guides_with_actions']} have review tasks.",
                        f"Collection errors: {report['summary']['collection_errors']}."]
              if 'deep_review' in report:
                  lines += [f"Microsoft deep-review states: {report['deep_review']['states']}. See the deep-review artifact for the next batch."]
              if not report['needs_review']:
                  lines += ['No new review signals. Review earlier unresolved findings before closing this task.']
          else:
              lines += ['No complete report was produced. Investigate the failed run before drawing conclusions.']
          lines += ['', '- [ ] Review upcoming/overdue transitions and official date conflicts.',
                    '- [ ] Resolve changed objectives, blocked sources and catalog discoveries.',
                    '- [ ] Update guides, metadata and evidence; run the shared validation gate.',
                    '- [ ] Accept reviewed snapshots together with the corresponding content changes.']
          Path('maintenance-issue.md').write_text('\n'.join(lines) + '\n')
          PY
          title="Recurring certification maintenance review"
          existing="$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Recurring certification maintenance review") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file maintenance-issue.md
          else
            gh issue create --title "$title" --body-file maintenance-issue.md
          fi
