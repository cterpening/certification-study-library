name: Validate repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install site dependencies
        run: python3 -m pip install --requirement requirements-site.txt

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate guides and links
        run: python3 scripts/validate_repository.py

      - name: Prepare and build the static site
        run: |
          python3 scripts/prepare_site.py
          python3 -m mkdocs build --strict --config-file .site-build/mkdocs.yml

      - name: Validate generated site links
        run: python3 scripts/validate_site.py
