name: Validate certification study library
description: Run the repository's shared test, validation, and static-site gate

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: requirements-site.txt

    - name: Install site dependencies
      shell: bash
      run: python3 -m pip install --requirement requirements-site.txt

    - name: Run unit tests
      shell: bash
      run: python3 -m unittest discover -s tests -v

    - name: Validate repository
      shell: bash
      run: python3 scripts/validate_repository.py

    - name: Prepare and build static site
      shell: bash
      run: |
        python3 scripts/prepare_site.py
        python3 -m mkdocs build --strict --config-file .site-build/mkdocs.yml

    - name: Validate generated site
      shell: bash
      run: python3 scripts/validate_site.py
